name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The whole point of the file-based design is that it behaves the same on
        # all three, so all three are gates rather than nice-to-haves.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npx vitest run

  no-pty:
    name: degraded (no node-pty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # node-pty is optional. Installing without it must still produce a working
      # tool, so this job proves the degraded path is not broken.
      - name: Install without optional dependencies
        run: npm ci --omit=optional

      - name: Build
        run: npm run build

      - name: Unit tests still pass
        run: npx vitest run --exclude test/integration.test.ts

      - name: Doctor reports the degraded mode instead of crashing
        run: node dist/cli/index.js doctor || true
