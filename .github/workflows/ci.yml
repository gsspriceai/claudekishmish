name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The whole point of the file-based design is that it behaves the same on
        # all three, so all three are gates rather than nice-to-haves.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npx vitest run

  no-pty:
    name: degraded (no node-pty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # node-pty is optional, and the build must not need it. This job exists
      # because the project once failed to compile at all without it (TS2307),
      # which made the whole degraded path unreachable.
      #
      # `npm ci --omit=optional` cannot be used: it also strips rollup's platform
      # binary, an optional dependency of the vite/vitest chain, and nothing runs
      # at all. Install normally and remove only the dependency under test.
      - name: Install, then remove node-pty
        run: |
          npm ci
          rm -rf node_modules/node-pty

      - name: Build
        run: npm run build

      - name: Unit tests still pass
        run: npx vitest run --exclude 'test/integration.test.ts'

      - name: Doctor reports the degraded mode instead of crashing
        run: node dist/cli/index.js doctor || true

  package:
    name: publishable tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

      # `dist/` is gitignored, so a tarball built without a prior build would
      # ship a `bin` pointing at nothing.
      - name: Pack and verify the entry point is present
        run: |
          npm pack --silent
          tar -tzf claudekishmish-*.tgz | grep -q 'package/dist/cli/index.js'
          tar -tzf claudekishmish-*.tgz | grep -q 'package/scripts/verify-against-real-history.mjs'

      - name: Installed CLI runs
        run: |
          npm i -g ./claudekishmish-*.tgz
          ckm --version
          ckm shim
